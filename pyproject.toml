[project]
name = "awp2"
version = "0.1.0"
description = "Klassifikation von Pflanzenart und Entwicklungsstadium aus Satellitendaten"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "docs"]

[tool.ruff]
line-length = 100
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "nbstripout>=0.9.1",
    "openpyxl>=3.1.5",
    "ruff>=0.16.9",
    "ty==0.0.84",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-awesome-nav>=3.3.0",
    "mkdocs-material>=9.7.7",
]
