[project]
name = "awp2"
version = "0.1.0"
description = "Klassifikation von Pflanzenart und Entwicklungsstadium aus Satellitendaten"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "psutil>=7.2.2",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "docs"]

[tool.ruff]
line-length = 100
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D", "DOC201", "DOC501"]
# DOC* (returns/raises documented) are preview rules; enable only the ones selected explicitly.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstrings are only required for the package API that the reference is generated from.
"!src/**" = ["D", "DOC201", "DOC501"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "nbstripout>=0.9.1",
    "openpyxl>=3.1.5",
    "ruff>=0.16.9",
    "ty==0.0.84",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-awesome-nav>=3.3.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
