<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">Schematische Reflexionskurve grüner Vegetation</title>
  <desc id="desc">Niedrige Reflexion im sichtbaren Licht, ein starker Anstieg an der Red Edge, ein hohes NIR-Plateau und eine stärker wechselnde Reflexion im SWIR.</desc>
  <style>
    .axis { stroke: #334155; stroke-width: 2; }
    .grid { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4 5; }
    .label { fill: #334155; font: 18px sans-serif; }
    .small { fill: #475569; font: 15px sans-serif; }
    .region { font: 700 17px sans-serif; }
  </style>
  <rect width="900" height="410" fill="#ffffff" />
  <rect x="90" y="45" width="126" height="275" fill="#dff3e4" />
  <rect x="216" y="45" width="198" height="275" fill="#e2efff" />
  <rect x="414" y="45" width="396" height="275" fill="#fff1d6" />
  <line class="grid" x1="90" y1="100" x2="810" y2="100" />
  <line class="grid" x1="90" y1="170" x2="810" y2="170" />
  <line class="grid" x1="90" y1="240" x2="810" y2="240" />
  <line class="axis" x1="90" y1="320" x2="810" y2="320" />
  <line class="axis" x1="90" y1="45" x2="90" y2="320" />
  <path d="M90 284 L124 274 L145 256 L164 264 L183 286 L205 293 L224 274 L240 214 L253 150 L271 114 L315 103 L369 107 L414 115 L438 148 L459 174 L480 149 L510 142 L544 188 L565 218 L591 182 L630 167 L654 210 L684 198 L718 235 L744 209 L770 241 L810 228" fill="none" stroke="#16803c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="227" y1="65" x2="227" y2="275" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 5" />
  <text class="region" x="125" y="35" fill="#166534">VIS</text>
  <text class="region" x="290" y="35" fill="#1d4ed8">NIR</text>
  <text class="region" x="590" y="35" fill="#a16207">SWIR</text>
  <text class="small" x="105" y="360">400</text>
  <text class="small" x="190" y="360">700</text>
  <text class="small" x="386" y="360">1300</text>
  <text class="small" x="780" y="360">2500 nm</text>
  <text class="small" x="184" y="83" fill="#9a3412">Red Edge</text>
  <text class="small" x="126" y="242" fill="#166534">grüne Reflexion</text>
  <text class="small" x="277" y="92" fill="#1d4ed8">NIR-Plateau</text>
  <text class="label" x="27" y="216" transform="rotate(-90 27 216)">Reflexion</text>
  <text class="label" x="360" y="397">Wellenlänge</text>
</svg>