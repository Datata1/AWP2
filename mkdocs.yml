site_name: awp2
site_description: Pflanzenart- und Entwicklungsstadium-Klassifikation aus Satellitendaten

theme:
  name: material
  language: de
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
